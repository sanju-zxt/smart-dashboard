<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Dashboard | Sanju</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main">
  <header>
    <h1>🚀 Smart Dashboard</h1>
    <p>Cloud-based Student Monitoring System</p>
  </header>

  <div class="grid">

    <div class="card">
      <h3>📊 Attendance</h3>
      <p id="attendance">--%</p>
    </div>

    <div class="card">
      <h3>✅ Tasks</h3>
      <p id="tasks">--</p>
    </div>

    <div class="card">
      <h3>⚡ Productivity</h3>
      <p id="productivity">--%</p>
    </div>

    <div class="card status-card">
      <h3>📌 Status</h3>
      <p id="status">Analyzing...</p>
    </div>

  </div>

  <footer>
    <p>Built by Sanju | Azure + GitHub</p>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
