<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Student Monitoring System</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="main">

  <header>
    <h1>🚀 Smart Student Monitoring System</h1>
    <p class="live-badge">● Live Data + Automated Alerts Enabled</p>
  </header>

  <div class="grid">

    <div class="card">
      <h3>📊 Attendance</h3>
      <p id="attendance">--%</p>
      <div class="progress">
        <div id="attendance-bar" class="progress-fill"></div>
      </div>
    </div>

    <div class="card">
      <h3>✅ Tasks</h3>
      <p id="tasks">--</p>
    </div>

    <div class="card">
      <h3>⚡ Productivity</h3>
      <p id="productivity">--%</p>
    </div>

    <div class="card">
      <h3>📌 Status</h3>
      <p id="status">Analyzing...</p>
    </div>

  </div>

  <p class="features">
    ✔ Automated Email Alerts | ✔ Multi-user Tracking | ✔ Cloud Integrated
  </p>

  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>

  <footer>
    <p>Built by Sanju | Cloud + Automation</p>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
