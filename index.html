<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Student Monitoring System</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="main">

  <!-- 🔐 LOGIN SECTION -->
  <div id="auth-box" style="margin-bottom:30px;">
    <h2>🔐 Login System</h2>
    <input id="email" placeholder="Email"><br><br>
    <input id="password" type="password" placeholder="Password"><br><br>
    <button onclick="signup()">Sign Up</button>
    <button onclick="login()">Login</button>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- 🚀 DASHBOARD -->
  <header>
    <h1>🚀 Smart Student Monitoring System</h1>
    <p class="live-badge">● Live Data + Automated Alerts Enabled</p>
  </header>

  <div class="grid">

    <div class="card">
      <h3>📊 Attendance</h3>
      <p id="attendance">--%</p>
      <div class="progress">
        <div id="attendance-bar" class="progress-fill"></div>
      </div>
    </div>

    <div class="card">
      <h3>✅ Tasks</h3>
      <p id="tasks">--</p>
    </div>

    <div class="card">
      <h3>⚡ Productivity</h3>
      <p id="productivity">--%</p>
    </div>

    <div class="card">
      <h3>📌 Status</h3>
      <p id="status">Analyzing...</p>
    </div>

  </div>

  <p class="features">
    ✔ Automated Email Alerts | ✔ Multi-user Tracking | ✔ Cloud Integrated
  </p>

  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>

  <footer>
    <p>Built by Sanju | Cloud + Automation</p>
  </footer>

</div>

<!-- 🔥 Firebase CDN (IMPORTANT) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
  // 🔥 YOUR FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyBvd-t8jfrBRpee87Ha_7M628B5k2XsHYA",
    authDomain: "smart-dashboard-9bc0a.firebaseapp.com",
    projectId: "smart-dashboard-9bc0a",
    storageBucket: "smart-dashboard-9bc0a.firebasestorage.app",
    messagingSenderId: "942832019777",
    appId: "1:942832019777:web:cb5ebd7121d493f1af59c0"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  function signup() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    auth.createUserWithEmailAndPassword(email, password)
      .then(() => alert("Signup successful"))
      .catch(err => alert(err.message));
  }

  function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    auth.signInWithEmailAndPassword(email, password)
      .then(() => alert("Login successful"))
      .catch(err => alert(err.message));
  }

  function logout() {
    auth.signOut().then(() => alert("Logged out"));
  }
</script>

<!-- 📊 Chart -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- ⚙️ Your Dashboard Script -->
<script src="script.js"></script>

</body>
</html>
