<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Student Monitoring System</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="main">

  <!-- LOGIN -->
  <div style="margin-bottom:30px;">
    <input id="email" placeholder="Email"><br><br>
    <input id="password" type="password" placeholder="Password"><br><br>
    <button onclick="signup()">Sign Up</button>
    <button onclick="login()">Login</button>
  </div>

  <!-- HEADER -->
  <header>
    <h1>🚀 Smart Student Monitoring System</h1>
    <p style="color:#38bdf8;">● Live Data + Automated Alerts</p>
  </header>

  <!-- DASHBOARD -->
  <div class="grid">

    <div class="card">
      <h3>📊 Attendance</h3>
      <p id="attendance">--%</p>
      <div class="progress">
        <div id="attendance-bar" class="progress-fill"></div>
      </div>
    </div>

    <div class="card">
      <h3>✅ Tasks</h3>
      <p id="tasks">--</p>
    </div>

    <div class="card">
      <h3>⚡ Productivity</h3>
      <p id="productivity">--%</p>
    </div>

    <div class="card">
      <h3>📌 Status</h3>
      <p id="status">Analyzing...</p>
    </div>

  </div>

  <!-- CHART -->
  <div style="margin-top:40px;">
    <canvas id="chart"></canvas>
  </div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBvd-t8jfrBRpee87Ha_7M628B5k2XsHYA",
  authDomain: "smart-dashboard-9bc0a.firebaseapp.com",
  projectId: "smart-dashboard-9bc0a",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function signup() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email, password)
    .then(() => alert("Signup success"))
    .catch(err => alert(err.message));
}

function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
    .then(() => alert("Login success"))
    .catch(err => alert(err.message));
}
</script>

<!-- CHART -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- MAIN SCRIPT -->
<script src="script.js"></script>

</body>
</html>
