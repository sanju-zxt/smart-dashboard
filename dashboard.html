<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="main">

  <button onclick="logout()" style="float:right;">Logout</button>

  <h1>🚀 Smart Student Monitoring System</h1>

  <div class="grid">

    <div class="card">
      <h3>📊 Attendance</h3>
      <p id="attendance">--%</p>
      <div class="progress">
        <div id="attendance-bar" class="progress-fill"></div>
      </div>
    </div>

    <div class="card">
      <h3>✅ Tasks</h3>
      <p id="tasks">--</p>
    </div>

    <div class="card">
      <h3>⚡ Productivity</h3>
      <p id="productivity">--%</p>
    </div>

    <div class="card">
      <h3>📌 Status</h3>
      <p id="status">Analyzing...</p>
    </div>

  </div>

  <canvas id="chart"></canvas>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBvd-t8jfrBRpee87Ha_7M628B5k2XsHYA",
  authDomain: "smart-dashboard-9bc0a.firebaseapp.com",
  projectId: "smart-dashboard-9bc0a",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// 🔐 Protect page
auth.onAuthStateChanged(user => {
  if (!user) {
    window.location.href = "login.html";
  }
});

function logout() {
  auth.signOut().then(() => {
    window.location.href = "login.html";
  });
}
</script>

<!-- Chart -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Main Script -->
<script src="script.js"></script>

</body>
</html>
